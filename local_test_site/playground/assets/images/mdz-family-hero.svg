<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">The MyDreamZone Racing Family</title>
<desc id="desc">Ilustrasi orisinal enam anggota keluarga tim balap di depan mobil sport oranye di dalam garasi.</desc>
<defs>
